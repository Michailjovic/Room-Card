<!DOCTYPE html>
<!--
  Studio harness (v6.41.0) for tests/studio.spec.js. Served over HTTP by the spec (module
  scripts and import() do not work from file://). The card is loaded as a MODULE, exactly as HA
  and HACS load it, so the studio is fetched by the card's own loader (rocLoadStudio) from the
  card's URL — the path a real install takes.

  ?editor=1  also mounts room-overlay-card-editor (the HA card-editor path)
-->
<html>
<head>
<meta charset="utf-8">
<title>room-overlay-card — studio harness</title>
<style>
  html,body{margin:0;padding:0;background:#111;color:#eee;font-family:sans-serif;}
  :root{--primary-color:#03a9f4;--card-background-color:#1c1f24;--primary-background-color:#111418;--secondary-background-color:#24282e;--divider-color:rgba(255,255,255,.12);--primary-text-color:#e8eaed;--secondary-text-color:#9aa3ad;}
  #dash{max-width:900px;margin:16px auto;}
  #ed{max-width:600px;margin:16px auto;background:#1c1f24;}
</style>
</head>
<body>
<div id="dash"></div>
<div id="ed"></div>
<script type="module" src="/room-overlay-card.js?hacstag=777"></script>
<script type="module">
await customElements.whenDefined('room-overlay-card');
await customElements.whenDefined('room-overlay-card-editor');
const svg=c=>'data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><rect width="1600" height="900" fill="'+c+'"/></svg>');
const hass={states:{'light.x':{state:'on',attributes:{friendly_name:'Lamp'}}},callService(){},language:'en',user:{name:'t',is_admin:true},themes:{}};
const cfg={type:'custom:room-overlay-card',card_id:'h',test_mode:true,aspect_ratio:'16/9',layout:{height:'container'},
  rooms:[{id:'a',name:'Living',base_image:svg('#123'),zones:[{id:'z1',top:'20%',left:'20%',width:'20%',height:'20%'}]},
         {id:'b',name:'Kitchen',base_image:svg('#321')}]};
const card=document.createElement('room-overlay-card');
card.style.cssText='display:block;height:500px;';
card.setConfig(JSON.parse(JSON.stringify(cfg)));card.hass=hass;
document.getElementById('dash').appendChild(card);
let editor=null;
if(new URLSearchParams(location.search).get('editor')){
  editor=document.createElement('room-overlay-card-editor');
  editor.setConfig(JSON.parse(JSON.stringify(cfg)));editor.hass=hass;
  document.getElementById('ed').appendChild(editor);
}
window.__h={card,editor,hass,cfg};
</script>
</body>
</html>
