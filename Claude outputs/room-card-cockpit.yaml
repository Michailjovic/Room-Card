type: custom:room-overlay-card
layout:
  height: fill
  portrait:
    rows:
      - auto
      - auto
      - auto
      - auto
      - 1fr
    place:
      nav:
        row: 1
      image:
        row: 3
      lights:
        row: 2
      cover:
        row: 4
  landscape:
    rows:
      - auto
      - auto
      - 1fr
      - auto
      - auto
    columns:
      - 1fr
      - auto
    place:
      nav:
        row: 1
        col: 1/3
      image:
        row: 3
      lights:
        row: 2
        col: 1/3
      cover:
        row: 3/6
        col: 2
aspect_ratio:
  portrait: 1720/914
  landscape: 1720/914
lock_aspect: 1720/914
border_radius:
  portrait: 0px
  landscape: 0px
filter_transition: 2.00s ease
card_id: flat_main
grid_options:
  columns: full
room_entity:
  default: sensor.1_r12_area
  by_browser:
    browser_mod_87c7874a_92838ff1: sensor.1_r12_area
    browser_mod_75650bfc_ca3bad3b: sensor.tablet_living_room_area
    browser_mod_74c189b9_fa97c2d5: sensor.tablet_bedroom_area
nav:
  live: full
  height: 75px
  wheel: horizontal
  chips:
    - entity: sensor.{room}_shelly_h_t_gen_3_{room}_temperature
      decimals: 1
      suffix: °
      color_gradient:
        - value: 17.5
          color: '#6cb8ff'
        - value: 18.5
          color: '#f2f3f5'
        - value: 24.5
          color: '#f2f3f5'
        - value: 25.5
          color: '#ff7a6e'
    - entity: sensor.{room}_shelly_h_t_gen_3_{room}_humidity
      suffix: '%'
      color_gradient:
        - value: 35
          color: '#6cb8ff'
        - value: 40
          color: '#f2f3f5'
        - value: 57
          color: '#f2f3f5'
        - value: 60
          color: '#ffb35c'
        - value: 65
          color: '#ff7a6e'
  cards:
    - card:
        type: custom:alert-ticker-card
        cycle_interval: 20
        show_when_clear: true
        clear_theme: success
        swipe_to_snooze: true
        card_height: 75
        alerts:
          - entity: sensor.bathroom_shelly_h_t_gen_3_bathroom_humidity
            operator: '>='
            state: '55'
            message: >-
              Zvýšená vlhkost v koupelně – {{
              states('sensor.bathroom_shelly_h_t_gen_3_bathroom_humidity') }}%
            priority: 1
            theme: leak
            icon: 💧
            show_badge: false
            tap_action:
              action: more-info
              entity_id: humidifier.nwt_dehumidifier
            hold_action:
              action: navigate
              navigation_path: /dashboard-various/Dehum
          - entity: sensor.living_room_shelly_h_t_gen_3_living_room_humidity
            operator: '>='
            state: '55'
            message: >-
              Zvýšená vlhkost v obýváku – {{
              states('sensor.living_room_shelly_h_t_gen_3_living_room_humidity')
              }}%
            priority: 1
            theme: leak
            icon: 💧
            show_badge: false
            tap_action:
              action: more-info
              entity_id: humidifier.dehumidifier_pasapair
            hold_action:
              action: navigate
              navigation_path: /dashboard-various/Dehum
          - entity: sensor.bedroom_shelly_h_t_gen_3_bedroom_humidity
            operator: '>='
            state: '55'
            message: >-
              Zvýšená vlhkost v ložnici – {{
              states('sensor.bedroom_shelly_h_t_gen_3_bedroom_humidity') }}%
            priority: 1
            theme: leak
            icon: 💧
            show_badge: false
            tap_action:
              action: more-info
              entity_id: humidifier.wdh_214us
            hold_action:
              action: navigate
              navigation_path: /dashboard-various/Dehum
          - entity: humidifier.nwt_dehumidifier
            operator: '='
            state: 'on'
            message: >-
              Vysoušeč Koupelna – {{
              states('sensor.bathroom_esp_humidity_s3_lite_vlhkost') }}%
            priority: 1
            theme: update
            icon: mdi:fan
            show_badge: false
            tap_action:
              action: more-info
              entity_id: humidifier.nwt_dehumidifier
            secondary_text: >-
              WDH {{ state_attr('humidifier.nwt_dehumidifier',
              'current_humidity') }}% - {{
              states('sensor.plug_shelly_dehumidifier_bathroom_power') }} W
            hold_action:
              action: navigate
              navigation_path: /dashboard-various/Dehum
            use_ha_icon: true
            icon_color: cyan
          - entity: humidifier.dehumidifier_pasapair
            operator: '='
            state: 'on'
            message: >-
              Vysoušeč Obývák – {{
              states('sensor.living_room_shelly_h_t_gen_3_living_room_humidity')
              }}%
            priority: 1
            theme: update
            icon: mdi:fan
            show_badge: false
            tap_action:
              action: more-info
              entity_id: humidifier.dehumidifier_pasapair
            secondary_text: >-
              WDH {{ state_attr('humidifier.dehumidifier_pasapair',
              'current_humidity') }}% - {{
              states('sensor.power_strip_pc_power_4') }} W
            hold_action:
              action: navigate
              navigation_path: /dashboard-various/Dehum
            use_ha_icon: true
            icon_color: cyan
          - entity: humidifier.wdh_214us
            operator: '='
            state: 'on'
            message: >-
              Vysoušeč Ložnice – {{
              states('sensor.bedroom_shelly_h_t_gen_3_bedroom_humidity') }}%
            priority: 1
            theme: update
            icon: mdi:fan
            show_badge: false
            tap_action:
              action: more-info
              entity_id: humidifier.wdh_214us
            secondary_text: >-
              WDH {{ state_attr('humidifier.wdh_214us', 'current_humidity') }}%
              - {{ states('sensor.plug_shelly_dehumidifier_bedroom_power') }} W
            hold_action:
              action: navigate
              navigation_path: /dashboard-various/Dehum
            use_ha_icon: true
            icon_color: cyan
          - entity: sensor.bosch_washerdryer_operation_state
            operator: '='
            state: run
            message: >-
              Pračka běží – Zbývá {% set h =
              states('sensor.bosch_washerdryer_estimated_total_program_time') |
              float(0) %} {% set m = (h * 60) | round(0) | int %} {% if m > 60
              %}{{ (m // 60) }}h {{ m % 60 }}min{% else %}{{ m }} min{% endif %}
            priority: 3
            theme: info
            icon: 🫧
            show_badge: false
            tap_action:
              action: navigate
              navigation_path: /dashboard-various/washerdryer
          - entity: sensor.bosch_mycka_operation_state
            operator: '='
            state: run
            message: >-
              Myčka běží – {% set end =
              states('sensor.bosch_mycka_remaining_program_time') %} {% if end
              and end != 'unknown' %} {% set m = [((
              as_datetime(end).timestamp() - now().timestamp()) / 60) | round(0)
              | int, 0] | max %} {% if m > 60 %}{{ (m // 60) }}h {{ m % 60
              }}min{% else %}{{ m }} min{% endif %}{% else %}--{% endif %}
            priority: 3
            theme: info
            icon: 🍽️
            show_badge: false
            tap_action:
              action: navigate
              navigation_path: /dashboard-various/dishwasher
          - entity: sensor.bosch_oven_operation_state
            operator: '='
            state: run
            message: >-
              Trouba běží – {% set end =
              states('sensor.bosch_oven_remaining_program_time') %} {% if end
              and end != 'unknown' %} {% set m = [((
              as_datetime(end).timestamp() - now().timestamp()) / 60) | round(0)
              | int, 0] | max %} {% if m > 60 %}{{ (m // 60) }}h {{ m % 60
              }}min{% else %}{{ m }} min{% endif %}{% else %}--{% endif %}
            priority: 2
            theme: temperature
            icon: 🔥
            show_badge: false
            tap_action:
              action: navigate
              navigation_path: /dashboard-various/Oven
          - entity: binary_sensor.ariston_is_heating
            operator: '='
            state: 'on'
            message: >-
              Bojler nahřívá – {{ state_attr('water_heater.bojler',
              'current_temperature') }}°C → {{ state_attr('water_heater.bojler',
              'temperature') }}°C
            secondary_text: >-
              {% set ready = states('sensor.bojler_ready_time') %} {% if ready
              not in ('unavailable', 'unknown', '') %} Hotovo v {{ (ready |
              as_datetime | as_local).strftime('%H:%M') }} {% endif %}
            priority: 1
            theme: temperature
            icon: 🌡️
            show_badge: false
            tap_action:
              action: more-info
              entity_id: water_heater.bojler
          - entity: switch.hdo
            operator: '='
            state: 'on'
            message: >-
              Nízký tarif (NT) – změna v {{ (states('sensor.hdo_next_change_dt')
              | as_datetime | as_local).strftime('%H:%M') }}
            priority: 4
            theme: success
            icon: 🌿
            show_badge: false
            tap_action:
              action: navigate
              navigation_path: /dashboard-various/HDO
          - entity: switch.hdo
            operator: '='
            state: 'off'
            message: >-
              Vysoký tarif (VT) – změna v {{
              (states('sensor.hdo_next_change_dt') | as_datetime |
              as_local).strftime('%H:%M') }}
            priority: 1
            theme: emergency
            icon: ⚡
            show_badge: false
            tap_action:
              action: navigate
              navigation_path: /dashboard-various/HDO
          - entity: sensor.papir
            operator: contains
            state: dnes
            message: >-
              Dnes svoz – {{ states('sensor.papir') | regex_replace(find='
              dnes', replace='') }}
            priority: 1
            theme: caution
            icon: 🗑️
            show_badge: false
            tap_action:
              action: more-info
              entity_id: sensor.papir
          - entity: sensor.papir
            operator: contains
            state: zítra
            message: >-
              Zítra svoz – {{ states('sensor.papir') | regex_replace(find='
              zítra', replace='') }}
            priority: 3
            theme: info
            icon: 🗑️
            show_badge: false
            tap_action:
              action: more-info
              entity_id: sensor.papir
          - device_class: battery
            operator: <=
            state: '20'
            message: Nízká baterie – {name} ({state}%)
            priority: 2
            theme: battery3d
            show_badge: false
            device_class_exclude:
              - sensor.x6_pro_battery
              - sensor.bathroom_h_t_gen3_bathroom_battery
              - sensor.bedroom_h_t_gen3_bedroom_battery
              - sensor.hall_h_t_gen3_hall_battery
              - sensor.h_t_gen3_kitchen_battery
              - sensor.living_room_h_t_gen3_living_room_battery
          - entity_filter: update.
            operator: '='
            state: 'on'
            message: Aktualizace k dispozici – {name}
            priority: 3
            theme: update
            icon: 🔄
            show_badge: false
            entity_filter_exclude: []
sections:
  - id: appliances
    title: Spotřebiče
    icon: mdi:washing-machine
    tiles:
      - id: AirFryer
        name: Air Fryer
        entity: switch.dual_blaze_6_8qt_6_4_litre_smart_air_fryer
        icon: mdi:french-fries
        icon_animation: pulse
        active_state: 'on'
        value: >-
          {% set status =
          states('sensor.dual_blaze_6_8qt_6_4_litre_smart_air_fryer_cooking_status')
          %} {% set labels = {   'preheat_end': 'Předehřátí dokončeno',
          'preheat_stop': 'Předehřívání zastaveno',   'heating': 'Předehřívá
          se',   'cooking': 'Vaří',   'cooking_end': 'Hotovo',   'cooking_stop':
          'Vaření zastaveno',   'pull_out': 'Vytáhněte koš',   'ready':
          'Připraveno' } %} {% if status not in ['unknown', 'unavailable',
          'standby'] %}{{ labels.get(status, status) }}{% endif %}
        image: /local/Dashboards/Cockpit/Appliances/airfryer-off.webp
        overlays:
          - id: airfryer_state
            transition: 2s ease
            conditions:
              opacity:
                - value: 1
            state_images:
              - entity: >-
                  sensor.dual_blaze_6_8qt_6_4_litre_smart_air_fryer_cooking_status
                state: standby
                image: /local/Dashboards/Cockpit/Appliances/airfryer-off.webp
              - entity: >-
                  sensor.dual_blaze_6_8qt_6_4_litre_smart_air_fryer_cooking_status
                state: ready
                image: /local/Dashboards/Cockpit/Appliances/airfryer-off.webp
              - image: /local/Dashboards/Cockpit/Appliances/airfryer-cooking.webp
        image_ratio: 1/1
        tap_action:
          action: navigate
          navigation_path: /dashboard-various/Oven
      - id: trouba
        name: Trouba
        entity: sensor.bosch_oven_operation_state
        icon: mdi:stove
        icon_animation: pulse
        active_state: run
        value: >-
          {% set prog = states('sensor.bosch_oven_active_program') %} {% if prog
          not in ['unknown', 'unavailable', 'none'] %}{{ prog }}{% endif %}
        image: /local/Dashboards/Cockpit/Appliances/oven-off.webp
        overlays:
          - id: oven_state
            transition: 2s ease
            conditions:
              opacity:
                - value: 1
            state_images:
              - entity: sensor.bosch_oven_operation_state
                state: run
                image: /local/Dashboards/Cockpit/Appliances/oven-on.webp
              - image: /local/Dashboards/Cockpit/Appliances/oven-off.webp
        progress: sensor.bosch_oven_program_progress
        tap_action:
          action: navigate
          navigation_path: /dashboard-various/Oven
      - id: mycka
        name: Myčka
        entity: sensor.bosch_mycka_operation_state
        icon: mdi:dishwasher
        icon_animation: spin
        active_state: run
        value: >-
          {% set phase = states('sensor.bosch_mycka_program_phase') %} {% set
          labels = {   'none': 'Nečinná',   'prerinse': 'Předmytí',
          'mainwash': 'Hlavní mytí',   'finalrinse': 'Oplach',   'drying':
          'Sušení' } %} {{ labels.get(phase, phase) }}
        image: /local/Dashboards/Cockpit/Appliances/dishwasher-closed.webp
        image_ratio: 2/3
        overlays:
          - id: overlay_1
            transition: 2s ease
            conditions:
              opacity:
                - value: 1
            state_images:
              - entity: binary_sensor.bosch_mycka_door
                state: 'on'
                image: /local/Dashboards/Cockpit/Appliances/dishwasher-open.webp
              - entity: sensor.bosch_mycka_program_phase
                state: drying
                image: /local/Dashboards/Cockpit/Appliances/dishwasher-dry.webp
              - entity: sensor.bosch_mycka_program_phase
                state: prerinse
                image: /local/Dashboards/Cockpit/Appliances/dishwasher-wash.webp
              - entity: sensor.bosch_mycka_program_phase
                state: mainwash
                image: /local/Dashboards/Cockpit/Appliances/dishwasher-wash.webp
              - entity: sensor.bosch_mycka_program_phase
                state: finalrinse
                image: /local/Dashboards/Cockpit/Appliances/dishwasher-wash.webp
              - image: /local/Dashboards/Cockpit/Appliances/dishwasher-closed.webp
        progress: sensor.bosch_mycka_program_progress
        tap_action:
          action: navigate
          navigation_path: /dashboard-various/dishwasher
      - id: pracka
        name: Pračka a sušička
        entity: sensor.bosch_washerdryer_operation_state
        active_state: run
        value: >-
          {% set h =
          states('sensor.bosch_washerdryer_estimated_total_program_time') |
          float(0) %}{% set m = (h * 60) | round(0) | int %}{% if m > 60 %}{{ (m
          // 60) }}h {{ m % 60 }}min{% else %}{{ m }} min{% endif %}
        image: /local/Dashboards/Cockpit/Appliances/washer-closed.webp
        image_ratio: 2/3
        overlays:
          - id: washer_state
            conditions:
              opacity:
                - value: 1
            state_images:
              - entity: sensor.bosch_washerdryer_operation_state
                state: run
                image: /local/Dashboards/Cockpit/Appliances/washer-spinning.webp
              - entity: binary_sensor.bosch_washerdryer_door
                state: 'on'
                image: /local/Dashboards/Cockpit/Appliances/washer-half-open.webp
              - image: /local/Dashboards/Cockpit/Appliances/washer-closed.webp
            transition: 2s ease
        progress: sensor.bosch_washerdryer_program_progress
        tap_action:
          action: navigate
          navigation_path: /dashboard-various/washerdryer
  - id: media
    title: Media
    icon: mdi:cast
    tiles:
      - id: tv_loznice
        name: Ložnice
        entity: media_player.lg_webos_tv_oled83g58lw_beuyljp
        value: >-
          {% set src =
          states('sensor.lg_webos_tv_oled83g58lw_beuyljp_tv_source_bedroom') %}
          {{ src if src not in ['unknown','unavailable',''] else '' }}
        quick:
          - name: Hlasitost +
            icon: mdi:volume-plus
            service: media_player.volume_up
            target:
              entity_id: media_player.lg_webos_tv_oled83g58lw_beuyljp
          - name: Hlasitost -
            icon: mdi:volume-minus
            service: media_player.volume_down
            target:
              entity_id: media_player.lg_webos_tv_oled83g58lw_beuyljp
          - name: Power
            icon: mdi:power
            service: script.tv_power_toggle_s_wol
        image: /local/Dashboards/Cockpit/Media/tv-off.webp
        image_ratio: 16/9
        overlays:
          - id: tv_content
            conditions:
              opacity:
                - condition:
                    entity: media_player.lg_webos_tv_oled83g58lw_beuyljp
                    state_not:
                      - 'off'
                      - unavailable
                  value: 1
                - value: 0
            state_images:
              - entity: sensor.lg_webos_tv_oled83g58lw_beuyljp_tv_source_bedroom
                state: Stremio
                image: /local/Dashboards/Cockpit/Media/tv-Stremio.webp
              - entity: sensor.lg_webos_tv_oled83g58lw_beuyljp_tv_source_bedroom
                state: YouTube AdFree
                image: /local/Dashboards/Cockpit/Media/tv-YouTube.webp
              - image: /local/Dashboards/Cockpit/Media/tv-LG.webp
            transition: 2s ease
        tap_action:
          condition:
            entity: switch.01_tv
            state: 'on'
          then:
            action: navigate
            navigation_path: /dashboard-various/LG_remote
          else:
            action: more-info
            entity: switch.01_tv
      - id: tv_living_room
        name: Obývák
        entity: media_player.televize_v_obyvaku_2
        value: >-
          {% set ti =
          state_attr('media_player.televize_v_obyvaku_2','media_title') %} {%
          set ar =
          state_attr('media_player.televize_v_obyvaku_2','media_artist') %} {{
          (ti ~ ' – ' ~ ar) if (ti and ar) else (ti or '') }}
        quick:
          - name: Hlasitost +
            icon: mdi:volume-plus
            service: media_player.volume_up
            target:
              entity_id: media_player.televize_v_obyvaku_2
          - name: Hlasitost -
            icon: mdi:volume-minus
            service: media_player.volume_down
            target:
              entity_id: media_player.televize_v_obyvaku_2
        image: /local/Dashboards/Cockpit/Media/monitor-off.webp
        image_ratio: 16/9
        overlays:
          - id: tv_content
            conditions:
              opacity:
                - condition:
                    entity: media_player.televize_v_obyvaku_2
                    state_not:
                      - 'off'
                      - unavailable
                  value: 1
                - value: 0
            state_images:
              - entity: media_player.televize_v_obyvaku_2
                attribute: app_name
                state: Stremio
                image: /local/Dashboards/Cockpit/Media/monitor-Stremio.webp
              - entity: media_player.televize_v_obyvaku_2
                attribute: app_name
                state: Nuvio
                image: /local/Dashboards/Cockpit/Media/monitor-Stremio.webp
              - entity: media_player.televize_v_obyvaku_2
                attribute: app_name
                state: SmartTube beta
                image: /local/Dashboards/Cockpit/Media/monitor-YouTube.webp
              - image: /local/Dashboards/Cockpit/Media/monitor-LG.webp
            transition: 2s ease
        tap_action:
          action: navigate
          navigation_path: /dashboard-various/google-cast
    columns: 1
  - id: cleaning
    title: Úklid
    icon: mdi:robot-vacuum
    tiles:
      - id: vacuum_s6
        name: S6
        entity: vacuum.s6_kitchen
        icon: mdi:robot-vacuum
        icon_animation: spin
        active_state: cleaning
        value: >-
          {% set b = state_attr('vacuum.s6_kitchen','battery_level') %} {{ (b ~
          '%') if b is not none else '—' }}
        image: /local/Dashboards/Vacuum/S6.webp
        tap_action:
          action: navigate
          navigation_path: /dashboard-various/vacuum
        hold_action:
          action: more-info
          entity: vacuum.s6_kitchen
      - id: vacuum_s7
        name: S7MaxV
        entity: vacuum.s7_maxv
        icon: mdi:robot-vacuum
        icon_animation: spin
        active_state: cleaning
        value: >-
          {% set b = state_attr('vacuum.s7_maxv','battery_level') %} {{ (b ~
          '%') if b is not none else '—' }}
        image: /local/Dashboards/Vacuum/S7.webp
        tap_action:
          action: navigate
          navigation_path: /dashboard-various/vacuum
        hold_action:
          action: more-info
          entity: vacuum.s7_maxv
      - id: vacuum_s8
        name: S8MaxVUltra
        entity: vacuum.s8_maxv_ultra
        icon: mdi:robot-vacuum
        icon_animation: spin
        active_state: cleaning
        value: >-
          {% set b = state_attr('vacuum.s8_maxv_ultra','battery_level') %} {{ (b
          ~ '%') if b is not none else '—' }}
        image: /local/Dashboards/Vacuum/S8.webp
        tap_action:
          action: navigate
          navigation_path: /dashboard-various/vacuum
        hold_action:
          action: more-info
          entity: vacuum.s8_maxv_ultra
    columns: 1
  - id: covers
    title: Rolety
    icon: mdi:window-shutter
    card:
      type: vertical-stack
      cards:
        - type: tile
          entity: cover.roller_motor_bedroom
          name: Ložnice
          features:
            - type: cover-open-close
            - type: cover-position
        - type: horizontal-stack
          cards:
            - type: button
              name: Otevřeno
              icon: mdi:blinds-open
              tap_action:
                action: perform-action
                perform_action: cover.set_cover_position
                target:
                  entity_id: cover.roller_motor_bedroom
                data:
                  position: 100
            - type: button
              name: Den
              icon: mdi:blinds
              tap_action:
                action: perform-action
                perform_action: cover.set_cover_position
                target:
                  entity_id: cover.roller_motor_bedroom
                data:
                  position: 65
            - type: button
              name: Skulina
              icon: mdi:roller-shade
