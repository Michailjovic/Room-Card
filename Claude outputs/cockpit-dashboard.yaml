type: custom:room-overlay-card
layout:
  portrait:
    rows:
      - auto
      - auto
      - auto
      - auto
      - auto
    place:
      nav:
        row: 1
      image:
        row: 3
      lights:
        row: 2
      cover:
        row: 5
  landscape:
    rows:
      - auto
      - auto
      - auto
      - auto
      - auto
    columns:
      - 1fr
      - auto
    place:
      nav:
        row: 1
        col: 1/3
      cards_above:
        row: 2
        col: 1/3
      image:
        row: 3
      lights:
        row: 2
        col: 1/3
      cover:
        row: 3/6
        col: 2
aspect_ratio:
  portrait: 1720/914
  landscape: 1720/914
lock_aspect: 1720/914
border_radius:
  portrait: 0px
  landscape: 0px
filter_transition: 2.00s ease
card_id: flat_main
grid_options:
  columns: full
room_entity:
  default: sensor.1_r12_area
  by_browser:
    browser_mod_87c7874a_92838ff1: sensor.1_r12_area
    browser_mod_75650bfc_ca3bad3b: sensor.tablet_living_room_area
    browser_mod_74c189b9_fa97c2d5: sensor.tablet_bedroom_area
nav:
  live: full
  height: 75px
  wheel: horizontal
  chips:
    - entity: sensor.{room}_shelly_h_t_gen_3_{room}_temperature
      decimals: 1
      suffix: °
      background: rgba(0,0,0,0.55)
      border_radius: 2px
      padding: 1px 2px
      color_gradient:
        - value: 17.5
          color: '#40a9ff'
        - value: 18.5
          color: '#52c41a'
        - value: 24.5
          color: '#52c41a'
        - value: 25.5
          color: '#ff4d4f'
    - entity: sensor.{room}_shelly_h_t_gen_3_{room}_humidity
      suffix: '%'
      background: rgba(0,0,0,0.55)
      border_radius: 2px
      padding: 1px 2px
      color_gradient:
        - value: 54
          color: '#52c41a'
        - value: 56
          color: '#faad14'
        - value: 59
          color: '#faad14'
        - value: 61
          color: '#ff4d4f'
  cards:
    - card:
        type: custom:alert-ticker-card
        cycle_interval: 20
        show_when_clear: true
        clear_theme: success
        swipe_to_snooze: true
        card_height: 75
        alerts:
          - entity: sensor.bathroom_shelly_h_t_gen_3_bathroom_humidity
            operator: '>='
            state: '55'
            message: >-
              Zvýšená vlhkost v koupelně – {{
              states('sensor.bathroom_shelly_h_t_gen_3_bathroom_humidity') }}%
            priority: 1
            theme: leak
            icon: 💧
            show_badge: false
            tap_action:
              action: more-info
              entity_id: humidifier.nwt_dehumidifier
            hold_action:
              action: navigate
              navigation_path: /dashboard-various/Dehum
          - entity: sensor.living_room_shelly_h_t_gen_3_living_room_humidity
            operator: '>='
            state: '55'
            message: >-
              Zvýšená vlhkost v obýváku – {{
              states('sensor.living_room_shelly_h_t_gen_3_living_room_humidity')
              }}%
            priority: 1
            theme: leak
            icon: 💧
            show_badge: false
            tap_action:
              action: more-info
              entity_id: humidifier.dehumidifier_pasapair
            hold_action:
              action: navigate
              navigation_path: /dashboard-various/Dehum
          - entity: sensor.bedroom_shelly_h_t_gen_3_bedroom_humidity
            operator: '>='
            state: '55'
            message: >-
              Zvýšená vlhkost v ložnici – {{
              states('sensor.bedroom_shelly_h_t_gen_3_bedroom_humidity') }}%
            priority: 1
            theme: leak
            icon: 💧
            show_badge: false
            tap_action:
              action: more-info
              entity_id: humidifier.wdh_214us
            hold_action:
              action: navigate
              navigation_path: /dashboard-various/Dehum
          - entity: humidifier.nwt_dehumidifier
            operator: '='
            state: 'on'
            message: >-
              Vysoušeč Koupelna – {{
              states('sensor.bathroom_esp_humidity_s3_lite_vlhkost') }}%
            priority: 1
            theme: update
            icon: mdi:fan
            show_badge: false
            tap_action:
              action: more-info
              entity_id: humidifier.nwt_dehumidifier
            secondary_text: >-
              WDH {{ state_attr('humidifier.nwt_dehumidifier',
              'current_humidity') }}% - {{
              states('sensor.plug_shelly_dehumidifier_bathroom_power') }} W
            hold_action:
              action: navigate
              navigation_path: /dashboard-various/Dehum
            use_ha_icon: true
            icon_color: cyan
          - entity: humidifier.dehumidifier_pasapair
            operator: '='
            state: 'on'
            message: >-
              Vysoušeč Obývák – {{
              states('sensor.living_room_shelly_h_t_gen_3_living_room_humidity')
              }}%
            priority: 1
            theme: update
            icon: mdi:fan
            show_badge: false
            tap_action:
              action: more-info
              entity_id: humidifier.dehumidifier_pasapair
            secondary_text: >-
              WDH {{ state_attr('humidifier.dehumidifier_pasapair',
              'current_humidity') }}% - {{
              states('sensor.power_strip_pc_power_4') }} W
            hold_action:
              action: navigate
              navigation_path: /dashboard-various/Dehum
            use_ha_icon: true
            icon_color: cyan
          - entity: humidifier.wdh_214us
            operator: '='
            state: 'on'
            message: >-
              Vysoušeč Ložnice – {{
              states('sensor.bedroom_shelly_h_t_gen_3_bedroom_humidity') }}%
            priority: 1
            theme: update
            icon: mdi:fan
            show_badge: false
            tap_action:
              action: more-info
              entity_id: humidifier.wdh_214us
            secondary_text: >-
              WDH {{ state_attr('humidifier.wdh_214us', 'current_humidity') }}%
              - {{ states('sensor.plug_shelly_dehumidifier_bedroom_power') }} W
            hold_action:
              action: navigate
              navigation_path: /dashboard-various/Dehum
            use_ha_icon: true
            icon_color: cyan
          - entity: sensor.bosch_washerdryer_operation_state
            operator: '='
            state: run
            message: >-
              Pračka běží – Zbývá {% set h =
              states('sensor.bosch_washerdryer_estimated_total_program_time') |
              float(0) %} {% set m = (h * 60) | round(0) | int %} {% if m > 60
              %}{{ (m // 60) }}h {{ m % 60 }}min{% else %}{{ m }} min{% endif %}
            priority: 3
            theme: info
            icon: 🫧
            show_badge: false
            tap_action:
              action: navigate
              navigation_path: /dashboard-various/washerdryer
          - entity: sensor.bosch_mycka_operation_state
            operator: '='
            state: BSH.Common.EnumType.OperationState.Run
            message: >-
              Myčka běží – {% set end =
              states('sensor.bosch_mycka_remaining_program_time') %} {% if end
              and end != 'unknown' %} {% set m = [((
              as_datetime(end).timestamp() - now().timestamp()) / 60) | round(0)
              | int, 0] | max %} {% if m > 60 %}{{ (m // 60) }}h {{ m % 60
              }}min{% else %}{{ m }} min{% endif %}{% else %}--{% endif %}
            priority: 3
            theme: info
            icon: 🍽️
            show_badge: false
            tap_action:
              action: navigate
              navigation_path: /dashboard-various/dishwasher
          - entity: sensor.bosch_oven_operation_state
            operator: '='
            state: BSH.Common.EnumType.OperationState.Run
            message: >-
              Trouba běží – {% set end =
              states('sensor.bosch_oven_remaining_program_time') %} {% if end
              and end != 'unknown' %} {% set m = [((
              as_datetime(end).timestamp() - now().timestamp()) / 60) | round(0)
              | int, 0] | max %} {% if m > 60 %}{{ (m // 60) }}h {{ m % 60
              }}min{% else %}{{ m }} min{% endif %}{% else %}--{% endif %}
            priority: 2
            theme: temperature
            icon: 🔥
            show_badge: false
            tap_action:
              action: navigate
              navigation_path: /dashboard-various/Oven
          - entity: binary_sensor.ariston_is_heating
            operator: '='
            state: 'on'
            message: >-
              Bojler nahřívá – {{ state_attr('water_heater.bojler',
              'current_temperature') }}°C → {{ state_attr('water_heater.bojler',
              'temperature') }}°C
            secondary_text: >-
              {% set ready = states('sensor.bojler_ready_time') %} {% if ready
              not in ('unavailable', 'unknown', '') %} Hotovo v {{ (ready |
              as_datetime | as_local).strftime('%H:%M') }} {% endif %}
            priority: 1
            theme: temperature
            icon: 🌡️
            show_badge: false
            tap_action:
              action: more-info
              entity_id: water_heater.bojler
          - entity: switch.hdo
            operator: '='
            state: 'on'
            message: >-
              Nízký tarif (NT) – změna v {{ (states('sensor.hdo_next_change_dt')
              | as_datetime | as_local).strftime('%H:%M') }}
            priority: 4
            theme: success
            icon: 🌿
            show_badge: false
            tap_action:
              action: navigate
              navigation_path: /dashboard-various/HDO
          - entity: switch.hdo
            operator: '='
            state: 'off'
            message: >-
              Vysoký tarif (VT) – změna v {{
              (states('sensor.hdo_next_change_dt') | as_datetime |
              as_local).strftime('%H:%M') }}
            priority: 1
            theme: emergency
            icon: ⚡
            show_badge: false
            tap_action:
              action: navigate
              navigation_path: /dashboard-various/HDO
          - entity: sensor.papir
            operator: contains
            state: dnes
            message: >-
              Dnes svoz – {{ states('sensor.papir') | regex_replace(find='
              dnes', replace='') }}
            priority: 1
            theme: caution
            icon: 🗑️
            show_badge: false
            tap_action:
              action: more-info
              entity_id: sensor.papir
          - entity: sensor.papir
            operator: contains
            state: zítra
            message: >-
              Zítra svoz – {{ states('sensor.papir') | regex_replace(find='
              zítra', replace='') }}
            priority: 3
            theme: info
            icon: 🗑️
            show_badge: false
            tap_action:
              action: more-info
              entity_id: sensor.papir
          - device_class: battery
            operator: <=
            state: '20'
            message: Nízká baterie – {name} ({state}%)
            priority: 2
            theme: battery3d
            show_badge: false
            device_class_exclude:
              - sensor.x6_pro_battery
              - sensor.bathroom_h_t_gen3_bathroom_battery
              - sensor.bedroom_h_t_gen3_bedroom_battery
              - sensor.hall_h_t_gen3_hall_battery
              - sensor.h_t_gen3_kitchen_battery
              - sensor.living_room_h_t_gen3_living_room_battery
          - entity_filter: update.
            operator: '='
            state: 'on'
            message: Aktualizace k dispozici – {name}
            priority: 3
            theme: update
            icon: 🔄
            show_badge: false
            entity_filter_exclude: []
sections:
  - id: appliances
    title: Spotřebiče
    icon: mdi:washing-machine
  - id: media
    title: Media
    icon: mdi:cast
    source: auto
    domain: media_player
    tiles:
      - id: tv_loznice
        name: Ložnice
        entity: media_player.lg_webos_tv_oled83g58lw_beuyljp
        icon: mdi:television
        value: >-
          {% set src = states('sensor.lg_webos_tv_oled83g58lw_beuyljp_tv_source_bedroom') %}
          {{ src if src not in ['unknown','unavailable',''] else '' }}
        tap_action:
          condition:
            entity: switch.01_tv
            state: 'on'
          then:
            action: navigate
            navigation_path: /dashboard-various/LG_remote
          else:
            action: more-info
            entity: switch.01_tv
      - id: tv_obyvak
        name: Obývák
        entity: media_player.televize_v_obyvaku
        icon: mdi:television
        value: >-
          {% set act = state_attr('remote.televize_v_obyvaku','current_activity') %}
          {% set names = {'com.stremio.one':'Stremio','com.nuvio.app':'Nuvio','org.smarttube.beta':'SmartTube'} %}
          {{ names.get(act, act) if act else '' }}
        tap_action:
          action: navigate
          navigation_path: /dashboard-various/google-cast
      - id: projektor
        name: Plátno
        icon: mdi:projector-screen
        quick:
          - name: Nahoru
            icon: mdi:arrow-up-bold
            service: switch.turn_on
            target: { entity_id: switch.elitescreen_control_l1_up }
          - name: Dolů
            icon: mdi:arrow-down-bold
            service: switch.turn_on
            target: { entity_id: switch.elitescreen_control_l2_down }
  - id: cleaning
    title: Úklid
    icon: mdi:robot-vacuum
    source: auto
    domain: vacuum
  - id: covers
    title: Rolety
    icon: mdi:window-shutter
    card:
      type: vertical-stack
      cards:
        - type: tile
          entity: cover.roller_motor_bedroom
          name: Ložnice
          features:
            - type: cover-open-close
            - type: cover-position
        - type: horizontal-stack
          cards:
            - type: button
              name: Otevřeno
              icon: mdi:blinds-open
              tap_action:
                action: perform-action
                perform_action: cover.set_cover_position
                target: { entity_id: cover.roller_motor_bedroom }
                data: { position: 100 }
            - type: button
              name: Den
              icon: mdi:blinds
              tap_action:
                action: perform-action
                perform_action: cover.set_cover_position
                target: { entity_id: cover.roller_motor_bedroom }
                data: { position: 65 }
            - type: button
              name: Skulina
              icon: mdi:roller-shade
              tap_action:
                action: perform-action
                perform_action: cover.set_cover_position
                target: { entity_id: cover.roller_motor_bedroom }
                data: { position: 2 }
            - type: button
              name: Zavřeno
              icon: mdi:roller-shade-closed
              tap_action:
                action: perform-action
                perform_action: cover.set_cover_position
                target: { entity_id: cover.roller_motor_bedroom }
                data: { position: 0 }
        - type: tile
          entity: cover.roller_motor_living_room
          name: Obývák
          features:
            - type: cover-open-close
            - type: cover-position
        - type: horizontal-stack
          cards:
            - type: button
              name: Otevřeno
              icon: mdi:blinds-open
              tap_action:
                action: perform-action
                perform_action: cover.set_cover_position
                target: { entity_id: cover.roller_motor_living_room }
                data: { position: 100 }
            - type: button
              name: Den
              icon: mdi:blinds
              tap_action:
                action: perform-action
                perform_action: cover.set_cover_position
                target: { entity_id: cover.roller_motor_living_room }
                data: { position: 59 }
            - type: button
              name: Skulina
              icon: mdi:roller-shade
              tap_action:
                action: perform-action
                perform_action: cover.set_cover_position
                target: { entity_id: cover.roller_motor_living_room }
                data: { position: 2 }
            - type: button
              name: Zavřeno
              icon: mdi:roller-shade-closed
              tap_action:
                action: perform-action
                perform_action: cover.set_cover_position
                target: { entity_id: cover.roller_motor_living_room }
                data: { position: 0 }
rooms:
  - id: cockpit
    name: Cockpit
    icon: mdi:view-dashboard
    base_image: /local/Dashboards/Rooms/cockpit_view1.jpg
    icons:
      - id: open_appliances
        icon: mdi:washing-machine
        top: 8%
        left: 8%
        width: 8%
        height: 8%
        tap_action:
          action: open-section
          section: appliances
        z_index: 6
        section: appliances
      - id: open_cleaning
        icon: mdi:robot-vacuum
        top: 8%
        left: 20%
        width: 8%
        height: 8%
        tap_action:
          action: open-section
          section: cleaning
        z_index: 6
        section: cleaning
      - id: open_media
        icon: mdi:popcorn
        top: 8%
        left: 32%
        z_index: 6
        tap_action:
          action: open-section
          section: media
      - id: open_covers
        icon: mdi:roller-shade
        top: 8%
        left: 44%
        z_index: 6
        tap_action:
          action: open-section
          section: covers
  - id: bedroom
    name: Bedroom
    area_match:
      - Bedroom
    base_image: /local/Dashboards/Rooms/Bedroom-svetlo-off.webp
    filter_conditions:
      - condition:
          entity: light.light_group_bedroom
          state: 'on'
        filter: brightness(2.6) sepia(0.35) saturate(0.9)
      - condition:
          entity: sun.sun
          state: above_horizon
        filter: brightness(1.7) sepia(0.12) saturate(1.05)
      - filter: brightness(0.6) sepia(0.3)
    overlays:
      - id: overlay_svetlo
        transition: 2.0s ease
        image: /local/Dashboards/Rooms/Bedroom-overlay-SVETlo.webp
        conditions:
          opacity:
            - condition:
                entity: light.light_group_bedroom
                state: 'on'
              value: 1
            - value: 0
      - id: overlay_tv
        transition: 2.0s ease
        conditions:
          opacity:
            - condition:
                entity: media_player.lg_webos_tv_oled83g58lw_beuyljp
                state_not:
                  - 'off'
                  - unavailable
              value: 1
            - value: 0
        state_images:
          - entity: sensor.lg_webos_tv_oled83g58lw_beuyljp_tv_source_bedroom
            state: Stremio
            image: /local/Dashboards/Rooms/tv-Stremio-Test2.webp
          - entity: sensor.lg_webos_tv_oled83g58lw_beuyljp_tv_source_bedroom
            state: Nuvio TV
            image: /local/Dashboards/Rooms/tv-Stremio-Test2.webp
          - entity: sensor.lg_webos_tv_oled83g58lw_beuyljp_tv_source_bedroom
            state: YouTube AdFree
            image: /local/Dashboards/Rooms/tv-YouTube-Test2.webp
          - image: /local/Dashboards/Rooms/tv-LG-Test2.webp
      - id: overlay_dehumidifier
        transition: 2.0s ease
        image: /local/Dashboards/Rooms/overlay-Bedroom-dehumidifier.webp
        animation: pulse
        conditions:
          opacity:
            - condition:
                entity: humidifier.wdh_214us
                state: 'on'
                or:
                  entity: binary_sensor.wdh_214us_tank_full
                  state: 'on'
              value: 1
            - value: 0
          filter:
            - condition:
                entity: binary_sensor.wdh_214us_tank_full
                state: 'on'
              value: hue-rotate(120deg) saturate(3) brightness(1.3)
            - value: none
    zones:
      - id: zone_okno
        top: 21%
        left: 40.5%
        width: 17.5%
        height: 35.5%
        tap_action:
          action: navigate
          path: /dashboard-various/weather
        hold_action:
          action: toggle
          entity: input_boolean.zobrazeni_pocasi
      - id: zone_tv
        top: 30%
        left: 70%
        width: 20%
        height: 50%
        tap_action:
          condition:
            entity: switch.01_tv
            state: 'on'
          then:
            action: navigate
            path: /dashboard-various/LG_remote
          else:
            action: more-info
            entity: switch.01_tv
      - id: zone_vysousec
        top: 61.5%
        left: 50.5%
        width: 6%
        height: 15%
        section: appliances
        tile:
          name: Vysoušeč Ložnice
          entity: humidifier.wdh_214us
          icon: mdi:fan
          icon_animation: spin
          active_state: 'on'
          value: '{{ state_attr(''humidifier.wdh_214us'',''current_humidity'') }}%'
          tap_action:
            action: more-info
            entity: humidifier.wdh_214us
        tap_action:
          action: more-info
          entity: humidifier.wdh_214us
        hold_action:
          action: navigate
          path: /dashboard-various/Dehum
      - id: bed_charger
        top: 54%
        left: 2%
        width: 8%
        height: 35%
        tap_action:
          action: browser-mod-popup
          title: Nabíječka
          size: normal
          content:
            type: vertical-stack
            cards:
              - type: tile
                entity: switch.shelly_plug_s_gen3_bedroom_charger
                name: Nabíječka
                tap_action:
                  action: toggle
              - type: tile
                entity: sensor.plug_shelly_bedroom_charger_power
                name: Aktuální spotřeba
      - id: electricity
        top: 64%
        left: 62.5%
        width: 2%
        height: 4%
        tap_action:
          action: navigate
          path: /dashboard-various/HDO
        hold_action:
          action: navigate
          path: /dashboard-various/electricity
    elements:
      - id: weather_window
        top: 21.1%
        left: 40.6%
        width: 17.3%
        height: 35.6%
        card:
          type: custom:atmospheric-weather-card
          weather_entity: weather.weather_google
          sun_entity: sun.sun
          theme_entity: sun.sun
          card_height: auto
        visible:
          entity: cover.roller_motor_bedroom
          state_not: closed
        z_index: 4
        border_radius: '0'
        overflow: hidden
    blinds:
      - id: Roleta Bedroom
        top: 21.1%
        left: 40.6%
        width: 17.3%
        height: 35.6%
        entity: cover.roller_motor_bedroom
        min: 100
        max: 0
        blind_type: day_night
        z_index: 6
        slat_color: rgba(0,0,0,0.9)
        slat_count: 17
        attribute: current_position
        section: covers
        control:
          placement: dock
          slider: true
          presets:
            - position: 100
              icon: mdi:blinds-open
              color: amber
              name: Otevřeno
            - position: 65
              icon: mdi:blinds
              color: orange
              name: Den
            - position: 2
              icon: mdi:roller-shade
              color: blue-grey
              name: Skulina
            - position: 0
              icon: mdi:roller-shade-closed
              color: indigo
              name: Zavřeno
    light_controls:
      entities:
        - entity: light.panel_bedroom_1
          name: Levá
        - entity: light.panel_bedroom_2
          name: Střed
        - entity: light.panel_bedroom_3
          name: Pravá
      lux_sensor: sensor.presence_sensor_living_room_illuminance_3
      lux_max: 50
      columns: 3
      height: 2.5%
      color_low: '#00254d'
      color_high: '#f4c025'
      bg_off: '#000000'
  - id: kitchen
    name: Kitchen
    area_match:
      - Kitchen
    base_image: /local/Dashboards/Rooms/Kitchen-LG.png
    filter_conditions:
      - condition:
          entity: light.panel_kitchen
          state: 'on'
        filter: brightness(2) sepia(0.35) saturate(0.9)
      - filter: brightness(0.75) saturate(0.9)
    overlays:
      - id: overlay_led
        image: /local/Dashboards/Rooms/Overlay-Kitchen-led.webp
        transition: 2s ease
        conditions:
          opacity:
            - condition:
                entity: light.sensor_light_5ch
