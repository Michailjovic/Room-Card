<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Room Overlay Card — living floorplan prototype</title>
<style>
  :root{ --bg:#0d1117; --panel:#161b22; --line:#30363d; --txt:#e6edf3; --dim:#8b949e; --acc:#58a6ff; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
    font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  #stage{position:relative;width:100%;height:calc(100vh - 132px);overflow:hidden;background:#05070a}

  /* --- the plan itself ------------------------------------------------- */
  #plan{position:absolute;inset:0;margin:auto;overflow:hidden;background:#11161d}
  #plan .fp-base,#plan .fp-walls{position:absolute;inset:0;background-size:100% 100%;background-repeat:no-repeat}
  #plan .fp-walls{z-index:20;pointer-events:none}

  /* A slot = one room's footprint on the plan. The mini is mounted inside and
     scaled; the slot clips it. Same idea as a nav thumbnail host. */
  .slot{position:absolute;overflow:hidden;cursor:pointer;background:#0a0d12;
    z-index:10;-webkit-tap-highlight-color:transparent}
  .slot .veil{position:absolute;inset:0;z-index:5;pointer-events:none;
    background:rgba(4,7,12,var(--veil,.22));transition:background .3s ease}
  .slot:hover .veil{--veil:0}
  .slot .tag{position:absolute;left:6px;bottom:5px;z-index:6;pointer-events:none;
    font:600 11px/1.4 monospace;letter-spacing:.04em;color:#e9f0f7;
    text-shadow:0 1px 4px rgba(0,0,0,.95),0 0 12px rgba(0,0,0,.7)}
  .slot room-overlay-card{pointer-events:none}
  .slot img.comp{position:absolute;pointer-events:none;transition:filter .6s ease}

  /* --- full room view (what a tap opens) ------------------------------- */
  #full{position:absolute;inset:0;z-index:60;background:#05070a;display:none}
  #full.on{display:block}
  #full .inner{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:14px}
  #full room-overlay-card{width:min(100%,1100px);display:block}
  #back{position:absolute;top:12px;left:12px;z-index:70;padding:7px 14px;border-radius:8px;
    border:1px solid var(--line);background:rgba(13,17,23,.9);color:var(--txt);cursor:pointer;font-size:13px}

  /* --- control bar ----------------------------------------------------- */
  #bar{height:132px;border-top:1px solid var(--line);background:var(--panel);
    padding:10px 14px;display:flex;gap:18px;align-items:flex-start;overflow-x:auto}
  #bar h3{margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);font-weight:600}
  .grp{flex:none}
  .row{display:flex;gap:6px;align-items:center;margin-bottom:4px;font-size:12px;white-space:nowrap}
  .row label{min-width:74px;color:var(--dim)}
  input[type=range]{width:96px}
  button.tier{padding:5px 11px;border-radius:7px;border:1px solid var(--line);
    background:transparent;color:var(--txt);cursor:pointer;font-size:12px}
  button.tier.on{border-color:var(--acc);background:rgba(88,166,255,.14);color:var(--acc)}
  #stats{font:12px/1.6 monospace;color:var(--dim);white-space:pre}
  #stats b{color:var(--txt);font-weight:600}
</style>
</head>
<body>

<div id="stage">
  <div id="plan">
    <div class="fp-base"></div>
    <div class="fp-walls"></div>
  </div>
  <div id="full"><button id="back">← zpět na půdorys</button><div class="inner"></div></div>
</div>

<div id="bar">
  <div class="grp">
    <h3>Věrnost miniatur</h3>
    <button class="tier" id="t-composite">composite — jen obrázky</button>
    <button class="tier on" id="t-full">full — živé karty</button>
    <div class="row" style="margin-top:8px">
      <label>Závoj</label><input type="range" id="veil" min="0" max="60" value="22">
      <span id="veilv" style="color:var(--dim)">22 %</span>
    </div>
  </div>
  <div class="grp"><h3>Světla</h3><div id="lights"></div></div>
  <div class="grp"><h3>Rolety</h3><div id="blinds"></div></div>
  <div class="grp"><h3>Měření</h3><div id="stats">—</div></div>
</div>

<script>
// The card. From HA serve this file at /local/floorplan-prototype.html and it
// picks up the HACS copy; opened straight from the repo it uses the sibling file.
document.write('<scr'+'ipt src="'+(location.protocol==='file:'
  ? 'room-overlay-card.js'
  : '/local/community/room-overlay-card/room-overlay-card.js')+'"><\/scr'+'ipt>');
</script>

<script>
(function(){
'use strict';

/* ------------------------------------------------------------------ *
 * 1. Fake room photos. Replace `photo` with your own /local/... paths
 *    and this prototype shows YOUR flat.
 * ------------------------------------------------------------------ */
const svg=(w,h,inner)=>'data:image/svg+xml;utf8,'+encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'">'+inner+'</svg>');

function roomPhoto(o){
  // A crude "photo": back wall, floor, a window, and a couple of furniture blocks.
  return svg(1600,900,
    '<rect width="1600" height="900" fill="'+o.wall+'"/>'+
    '<rect y="620" width="1600" height="280" fill="'+o.floor+'"/>'+
    '<rect x="'+o.winX+'" y="150" width="330" height="360" fill="#16324a"/>'+
    '<rect x="'+(o.winX+12)+'" y="162" width="306" height="336" fill="#1d4около"/>'.replace('около','a63')+
    '<rect x="'+o.fx+'" y="470" width="420" height="190" rx="14" fill="'+o.f1+'"/>'+
    '<rect x="'+(o.fx+40)+'" y="410" width="120" height="70" rx="8" fill="'+o.f2+'"/>'+
    '<rect x="120" y="530" width="150" height="130" rx="10" fill="'+o.f2+'"/>');
}

const ROOMS=[
  {id:'obyvak',  name:'Obývák',  light:'light.obyvak',  cover:'cover.obyvak',
   photo:roomPhoto({wall:'#2b3440',floor:'#3a2f26',winX:1050,fx:380,f1:'#3d4654',f2:'#4a3c31'}),
   glow:{top:'46%',left:'30%',size:'34%',color:'#ffb46e'},
   slot:{top:'6%',left:'3%',width:'44%',height:'52%'}},
  {id:'kuchyn',  name:'Kuchyň',  light:'light.kuchyn',  cover:'cover.kuchyn',
   photo:roomPhoto({wall:'#26323a',floor:'#3c3c40',winX:1150,fx:300,f1:'#4c5b63',f2:'#33424a'}),
   glow:{top:'34%',left:'52%',width:'46%',height:'16%',shape:'ellipse',color:'#ffe9c2',falloff:'tight'},
   slot:{top:'62%',left:'3%',width:'44%',height:'32%'}},
  {id:'loznice', name:'Ložnice', light:'light.loznice', cover:'cover.loznice',
   photo:roomPhoto({wall:'#312b3b',floor:'#38302a',winX:1080,fx:340,f1:'#463c52',f2:'#524437'}),
   glow:{top:'52%',left:'20%',size:'26%',color:'#ff9a5c'},
   slot:{top:'6%',left:'51%',width:'32%',height:'46%'}},
  {id:'koupelna',name:'Koupelna',light:'light.koupelna',cover:null,
   photo:roomPhoto({wall:'#243640',floor:'#42484c',winX:1180,fx:420,f1:'#54626b',f2:'#3a4a53'}),
   glow:{top:'28%',left:'50%',width:'52%',height:'14%',shape:'wash',angle:'180deg',color:'#cfe4ff',falloff:'wide'},
   slot:{top:'56%',left:'51%',width:'32%',height:'38%'}},
  {id:'predsin', name:'Předsíň', light:'light.predsin', cover:null,
   photo:roomPhoto({wall:'#2a2f36',floor:'#38332d',winX:1300,fx:260,f1:'#3f454d',f2:'#4b4038'}),
   glow:{top:'26%',left:'50%',size:'40%',color:'#ffd9a8'},
   slot:{top:'6%',left:'86%',width:'11%',height:'88%'}}
];

const PLAN_W=1600, PLAN_H=900;
const pct=v=>parseFloat(v)/100;

// Plan base: floor + doorway gaps. Walls are a SEPARATE layer drawn from the
// same rectangles, so they line up with the slots exactly — that top layer is
// what stops the minis reading as a collage of photos.
function planBase(){
  let s='<rect width="'+PLAN_W+'" height="'+PLAN_H+'" fill="#0f141b"/>';
  ROOMS.forEach(r=>{
    const x=pct(r.slot.left)*PLAN_W,y=pct(r.slot.top)*PLAN_H,
          w=pct(r.slot.width)*PLAN_W,h=pct(r.slot.height)*PLAN_H;
    s+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="#161d26"/>';
  });
  return svg(PLAN_W,PLAN_H,s);
}
function planWalls(){
  let s='';
  ROOMS.forEach(r=>{
    const x=pct(r.slot.left)*PLAN_W,y=pct(r.slot.top)*PLAN_H,
          w=pct(r.slot.width)*PLAN_W,h=pct(r.slot.height)*PLAN_H;
    s+='<rect x="'+(x-7)+'" y="'+(y-7)+'" width="'+(w+14)+'" height="'+(h+14)+'" '+
       'fill="none" stroke="#e8edf3" stroke-width="9" opacity="0.92"/>';
    s+='<rect x="'+(x-7)+'" y="'+(y-7)+'" width="'+(w+14)+'" height="'+(h+14)+'" '+
       'fill="none" stroke="#0b0f14" stroke-width="2" opacity="0.8"/>';
    // a door gap on the corridor side
    const doorY=y+h*0.55;
    s+='<rect x="'+(x+w-2)+'" y="'+doorY+'" width="18" height="70" fill="#161d26"/>';
  });
  return svg(PLAN_W,PLAN_H,s);
}

/* ------------------------------------------------------------------ *
 * 2. Mock hass
 * ------------------------------------------------------------------ */
const states={};
ROOMS.forEach(r=>{
  states[r.light]={entity_id:r.light,state:'off',attributes:{brightness:255,friendly_name:r.name}};
  if(r.cover)states[r.cover]={entity_id:r.cover,state:'open',attributes:{current_position:100}};
});
states['sensor.venku']={entity_id:'sensor.venku',state:'11.4',attributes:{unit_of_measurement:'°C'}};

let hass={states:states,callService(){},user:{name:'proto'},connection:null,locale:{language:'cs'}};
function pushHass(){
  hass=Object.assign({},hass,{states:Object.assign({},states)});
  const t0=performance.now();
  mounted.forEach(m=>{try{m.el.hass=hass;}catch(e){}});
  if(fullCard)try{fullCard.hass=hass;}catch(e){}
  lastUpdate=performance.now()-t0;
  if(tier==='composite')paintComposite();
  drawStats();
}

/* ------------------------------------------------------------------ *
 * 3. Room card config — the same config a real room would have
 * ------------------------------------------------------------------ */
function roomConfig(r,mini){
  const cfg={
    type:'custom:room-overlay-card',
    base_image:r.photo,
    aspect_ratio:'16/9',
    border_radius:'0px',
    layout:{portrait:{rows:[100],place:{image:{row:1}}},
            landscape:{rows:[100],place:{image:{row:1}}}},
    // the room goes dark when its light is off — the main signal on a plan
    filter_conditions:[
      {condition:{entity:r.light,state:'on'},filter:'brightness(1) saturate(1)'},
      {filter:'brightness(0.34) saturate(0.55)'}
    ],
    filter_transition:'0.7s ease',
    glows:[Object.assign({id:'lamp',entity:r.light,intensity:0.8},r.glow)],
    labels:[{id:'t',top:'6%',left:'5%',entity:'sensor.venku',prefix:'',suffix:' °C',
             font_size:'22px',color:'#dbe6f0'}]
  };
  if(r.cover){
    cfg.blinds=[{id:'bl',entity:r.cover,attribute:'current_position',
                 top:'15%',left:'64%',width:'22%',height:'42%',
                 blind_type:'roller',slat_color:'#9fb0bd',z_index:6}];
  }
  if(mini){
    // exactly what rocBuildMiniConfig does for a nav.live mini
    cfg._roc_mini=true; cfg._roc_preview=true;
    cfg.test_mode=false; cfg.nav={style:'none'};
  }
  return cfg;
}

/* ------------------------------------------------------------------ *
 * 4. Mount / scale — the nav.live: full mechanism, different host
 * ------------------------------------------------------------------ */
const W_REF=480;                 // reference width every mini renders at
const planEl=document.getElementById('plan');
const mounted=[];
let tier='full', lastMount=0, lastUpdate=0, fullCard=null;

function sizePlan(){
  const st=document.getElementById('stage');
  const s=Math.min(st.clientWidth/PLAN_W, st.clientHeight/PLAN_H);
  planEl.style.width=(PLAN_W*s)+'px';
  planEl.style.height=(PLAN_H*s)+'px';
}

function clearSlots(){
  planEl.querySelectorAll('.slot').forEach(n=>n.remove());
  mounted.length=0;
}

function buildSlots(){
  clearSlots();
  const t0=performance.now();
  ROOMS.forEach((r,i)=>{
    const slot=document.createElement('div');
    slot.className='slot';
    slot.style.top=r.slot.top; slot.style.left=r.slot.left;
    slot.style.width=r.slot.width; slot.style.height=r.slot.height;
    slot.addEventListener('click',()=>openRoom(r));
    const veil=document.createElement('div'); veil.className='veil';
    const tag=document.createElement('div'); tag.className='tag'; tag.textContent=r.name;

    if(tier==='full'){
      const mc=document.createElement('room-overlay-card');
      mc.style.cssText='display:block;position:absolute;top:0;left:0;width:'+W_REF+
        'px;transform-origin:top left;';
      slot.appendChild(mc);                    // connect BEFORE setConfig
      slot.appendChild(veil); slot.appendChild(tag);
      planEl.appendChild(slot);
      mc.setConfig(roomConfig(r,true));
      try{mc.hass=hass;}catch(e){}
      mounted.push({el:mc,slot:slot,room:r});
    }else{
      const img=document.createElement('img');
      img.className='comp'; img.src=r.photo;
      slot.appendChild(img);
      slot.appendChild(veil); slot.appendChild(tag);
      planEl.appendChild(slot);
      mounted.push({el:img,slot:slot,room:r,composite:true});
    }
  });
  lastMount=performance.now()-t0;
  requestAnimationFrame(()=>{ scaleAll(); if(tier==='composite')paintComposite(); drawStats(); });
}

// cover-fit: scale so the mini fills the slot on both axes, then centre it.
function scaleAll(){
  mounted.forEach(m=>{
    const sw=m.slot.clientWidth, sh=m.slot.clientHeight;
    if(m.composite){
      const ar=16/9, s=Math.max(sw/(PLAN_W), sh/(PLAN_W/ar));
      const w=PLAN_W*s, h=(PLAN_W/ar)*s;
      m.el.style.width=w+'px'; m.el.style.height=h+'px';
      m.el.style.left=((sw-w)/2)+'px'; m.el.style.top=((sh-h)/2)+'px';
      return;
    }
    const hRef=m.el.offsetHeight||W_REF*9/16;
    const s=Math.max(sw/W_REF, sh/hRef);
    m.el.style.transform='scale('+s+')';
    m.el.style.left=((sw-W_REF*s)/2)+'px';
    m.el.style.top=((sh-hRef*s)/2)+'px';
  });
}

// The cheap tier: no card instance at all, just the room photo with the same
// filter the card would apply. Proves how much of the signal survives.
function paintComposite(){
  mounted.forEach(m=>{
    if(!m.composite)return;
    const on=states[m.room.light].state==='on';
    m.el.style.filter=on?'brightness(1) saturate(1)':'brightness(0.34) saturate(0.55)';
  });
}

/* ------------------------------------------------------------------ *
 * 5. Tap a slot -> the room's full card (what switch-room would do)
 * ------------------------------------------------------------------ */
const fullWrap=document.getElementById('full');
const fullInner=fullWrap.querySelector('.inner');
function openRoom(r){
  fullInner.innerHTML='';
  fullCard=document.createElement('room-overlay-card');
  fullInner.appendChild(fullCard);
  fullCard.setConfig(roomConfig(r,false));
  try{fullCard.hass=hass;}catch(e){}
  fullWrap.classList.add('on');
}
document.getElementById('back').addEventListener('click',e=>{
  e.stopPropagation(); fullWrap.classList.remove('on');
  fullInner.innerHTML=''; fullCard=null;
});

/* ------------------------------------------------------------------ *
 * 6. Controls
 * ------------------------------------------------------------------ */
const lightsBox=document.getElementById('lights'), blindsBox=document.getElementById('blinds');
ROOMS.forEach(r=>{
  const row=document.createElement('div'); row.className='row';
  const cb=document.createElement('input'); cb.type='checkbox';
  cb.addEventListener('change',()=>{states[r.light].state=cb.checked?'on':'off';pushHass();});
  const lab=document.createElement('label'); lab.textContent=r.name;
  row.appendChild(lab); row.appendChild(cb); lightsBox.appendChild(row);

  if(r.cover){
    const br=document.createElement('div'); br.className='row';
    const sl=document.createElement('input'); sl.type='range'; sl.min=0; sl.max=100; sl.value=100;
    sl.addEventListener('input',()=>{
      states[r.cover].attributes.current_position=Number(sl.value);
      states[r.cover].state=Number(sl.value)>0?'open':'closed'; pushHass();});
    const bl=document.createElement('label'); bl.textContent=r.name;
    br.appendChild(bl); br.appendChild(sl); blindsBox.appendChild(br);
  }
});

const tFull=document.getElementById('t-full'), tComp=document.getElementById('t-composite');
function setTier(t){
  tier=t; tFull.classList.toggle('on',t==='full'); tComp.classList.toggle('on',t==='composite');
  buildSlots();
}
tFull.addEventListener('click',()=>setTier('full'));
tComp.addEventListener('click',()=>setTier('composite'));

const veil=document.getElementById('veil'), veilv=document.getElementById('veilv');
veil.addEventListener('input',()=>{
  planEl.style.setProperty('--veil',(veil.value/100));
  document.querySelectorAll('.slot .veil').forEach(v=>v.style.background='rgba(4,7,12,'+(veil.value/100)+')');
  veilv.textContent=veil.value+' %';
});

function drawStats(){
  document.getElementById('stats').innerHTML=
    'místností:   <b>'+ROOMS.length+'</b>\n'+
    'režim:       <b>'+tier+'</b>\n'+
    'mount:       <b>'+lastMount.toFixed(1)+' ms</b>\n'+
    'update/stav: <b>'+lastUpdate.toFixed(1)+' ms</b>';
}

/* ------------------------------------------------------------------ */
function boot(){
  planEl.querySelector('.fp-base').style.backgroundImage='url("'+planBase()+'")';
  planEl.querySelector('.fp-walls').style.backgroundImage='url("'+planWalls()+'")';
  sizePlan(); buildSlots();
}
window.addEventListener('resize',()=>{sizePlan();scaleAll();});

if(customElements.get('room-overlay-card'))boot();
else customElements.whenDefined('room-overlay-card').then(boot);

window.__proto={boot:boot,setTier:setTier,states:states,pushHass:pushHass,
  mounted:mounted,openRoom:openRoom,rooms:ROOMS,stats:()=>({mount:lastMount,update:lastUpdate})};
})();
</script>
</body>
</html>
