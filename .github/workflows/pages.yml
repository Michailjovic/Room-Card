# Publishes the live demo (demo/) to GitHub Pages: the card, the studio and the floor plan renderer
# minified from this commit, next to demo/index.html, against the demo's mock Home Assistant.
# One-time setup in the repo: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Demo
on:
  push:
    branches: [master]
    paths: ['demo/**', 'src/**', 'room-overlay-card*.js', 'build.js', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build the minified bundles
        run: npm i --no-save terser jsdom && npm run build
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r demo/. _site/
          cp dist/room-overlay-card*.js dist/room-overlay-card*.js.map _site/
          touch _site/.nojekyll
          du -sh _site
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
