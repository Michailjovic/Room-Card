# Attaches the release assets to every published GitHub release (incl. pre-releases):
#   room-overlay-card.js         the card (hacs.json "filename")
#   room-overlay-card-studio.js  Room Card Studio, loaded on demand by the card (v6.41.0+)
#   + their source maps
# HACS downloads the file named in hacs.json's "filename" from the RELEASE ASSETS of the
# selected version — a release without it fails in HACS with "unknown error" — and for a
# plugin it downloads EVERY release asset, which is how the studio file reaches HACS users.
# That failure happened with v4.6.2: the previous single-shot upload (softprops action) hit a
# transient GitHub 503 and the release stayed asset-less with nothing re-trying or
# verifying. This version uses the gh CLI with retries and FAILS THE RUN if an asset
# is not verifiably attached at the end, so a broken release is impossible to miss.
#
# Backfill: Actions → "Release" → Run workflow → enter an existing tag (e.g. v4.6.2).
# Tags before v6.41.0 have no studio file; the workflow then uploads only the card.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)attach the assets to (e.g. v4.6.2)"
        required: true

permissions:
  contents: write

jobs:
  upload-release-asset:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: echo "tag=${{ github.event.release.tag_name || inputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: Checkout tagged source
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # The released files are MINIFIED (~31 % smaller raw, ~36 % gzipped);
      # the repo keeps the readable source. build.js --check fails the run if an
      # output is truncated, not smaller than its source, or missing the version
      # / its registrations.
      - name: Build the minified bundles
        run: npm i --no-save terser jsdom && npm run build:verify

      - name: List the assets to upload
        id: assets
        run: |
          files="dist/room-overlay-card.js dist/room-overlay-card.js.map"
          if [ -f dist/room-overlay-card-studio.js ]; then
            files="$files dist/room-overlay-card-studio.js dist/room-overlay-card-studio.js.map"
          fi
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "Uploading: $files"

      - name: Upload the assets (retry on transient GitHub errors)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          FILES: ${{ steps.assets.outputs.files }}
        run: |
          for i in 1 2 3 4 5; do
            if gh release upload "$TAG" $FILES --clobber; then
              exit 0
            fi
            echo "Upload attempt $i failed — retrying in $((i*10)) s…"
            sleep $((i*10))
          done
          echo "::error::All upload attempts failed"
          exit 1

      # Verify by DOWNLOADING each asset back, not just by listing names: an
      # asset can exist and still be the wrong or a truncated file. v4.6.2
      # shipped an asset-less release after a transient 503 and failed in HACS
      # with "unknown error"; a wrong-contents asset would fail just as opaquely.
      - name: Verify the attached assets are the built bundles
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          VER="$(node -p "require('./package.json').version")"
          names="room-overlay-card.js"
          [ -f dist/room-overlay-card-studio.js ] && names="$names room-overlay-card-studio.js"
          rm -rf /tmp/verify && mkdir -p /tmp/verify
          for n in $names; do
            if ! gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx "$n"; then
              echo "::error::$n is NOT attached to $TAG — HACS installs of this version will fail"
              exit 1
            fi
            gh release download "$TAG" -p "$n" -D /tmp/verify --clobber
            if ! cmp -s "/tmp/verify/$n" "dist/$n"; then
              echo "::error::the attached $n does not match the freshly built bundle"
              exit 1
            fi
            if ! grep -q "$VER" "/tmp/verify/$n"; then
              echo "::error::attached $n does not contain version $VER"
              exit 1
            fi
            echo "$n v$VER verified on $TAG ($(wc -c < "/tmp/verify/$n") bytes)"
          done
