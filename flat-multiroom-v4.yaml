type: custom:room-overlay-card
# ---- v4 layout: both profiles share the same stack; the image absorbs the
# ---- remaining height (1fr) and 'auto' rows collapse in rooms without content.
# ---- cards_above & lights share row 2 — no room has both, so they never clash.
# ---- Replace any 'auto'/'1fr' with a % once you want fixed shares (e.g. 8, 6, 70, 16).
layout:
  portrait:
    rows: [auto, auto, 1fr, auto]
    place:
      nav: { row: 1 }
      cards_above: { row: 2 }
      lights: { row: 2 }
      image: { row: 3 }
      cards_below: { row: 4 }
  landscape:
    rows: [auto, auto, 1fr, auto]
    place:
      nav: { row: 1 }
      cards_above: { row: 2 }
      lights: { row: 2 }
      image: { row: 3 }
      cards_below: { row: 4 }
aspect_ratio: 1720/914
lock_aspect: true
border_radius: 0px
filter_transition: 2.0s ease
card_id: flat_main
grid_options:
  columns: full
room_entity:
  default: sensor.1_r12_area
  by_browser:
    browser_mod_87c7874a_92838ff1: sensor.1_r12_area
    browser_mod_75650bfc_ca3bad3b: sensor.tablet_living_room_area
    browser_mod_74c189b9_fa97c2d5: sensor.tablet_bedroom_area
nav:
  live: composite
  height: 75px
  wheel: horizontal
  chips:
    - entity: sensor.{room}_shelly_h_t_gen_3_{room}_temperature
      decimals: 1
      suffix: °
      background: rgba(0,0,0,0.55)
      border_radius: 2px
      padding: 1px 2px
      color_gradient:
        - value: 17.5
          color: "#40a9ff"
        - value: 18.5
          color: "#52c41a"
        - value: 24.5
          color: "#52c41a"
        - value: 25.5
          color: "#ff4d4f"
    - entity: sensor.{room}_shelly_h_t_gen_3_{room}_humidity
      suffix: "%"
      background: rgba(0,0,0,0.55)
      border_radius: 2px
      padding: 1px 2px
      color_gradient:
        - value: 54
          color: "#52c41a"
        - value: 56
          color: "#faad14"
        - value: 59
          color: "#faad14"
        - value: 61
          color: "#ff4d4f"
  cards:
    - card:
        type: custom:alert-ticker-card
        cycle_interval: 20
        show_when_clear: true
        clear_message: Vše v pořádku
        clear_theme: success
        swipe_to_snooze: true
        card_height: 75
        alerts:
          - entity: sensor.bathroom_shelly_h_t_gen_3_bathroom_humidity
            operator: ">="
            state: "55"
            message: >-
              Zvýšená vlhkost v koupelně – {{
              states('sensor.bathroom_shelly_h_t_gen_3_bathroom_humidity') }}%
            priority: 1
            theme: leak
            icon: 💧
            show_badge: false
            tap_action:
              action: more-info
              entity_id: humidifier.nwt_dehumidifier
            hold_action:
              action: navigate
              navigation_path: /dashboard-various/Dehum
          - entity: sensor.living_room_shelly_h_t_gen_3_living_room_humidity
            operator: ">="
            state: "55"
            message: >-
              Zvýšená vlhkost v obýváku – {{
              states('sensor.living_room_shelly_h_t_gen_3_living_room_humidity')
              }}%
            priority: 1
            theme: leak
            icon: 💧
            show_badge: false
            tap_action:
              action: more-info
              entity_id: humidifier.dehumidifier_pasapair
            hold_action:
              action: navigate
              navigation_path: /dashboard-various/Dehum
          - entity: sensor.bedroom_shelly_h_t_gen_3_bedroom_humidity
            operator: ">="
            state: "55"
            message: >-
              Zvýšená vlhkost v ložnici – {{
              states('sensor.bedroom_shelly_h_t_gen_3_bedroom_humidity') }}%
            priority: 1
            theme: leak
            icon: 💧
            show_badge: false
            tap_action:
              action: more-info
              entity_id: humidifier.wdh_214us
            hold_action:
              action: navigate
              navigation_path: /dashboard-various/Dehum
          - entity: humidifier.nwt_dehumidifier
            operator: "="
            state: "on"
            message: >-
              Vysoušeč Koupelna – {{
              states('sensor.bathroom_esp_humidity_s3_lite_vlhkost') }}%
            priority: 1
            theme: update
            icon: mdi:fan
            show_badge: false
            tap_action:
              action: more-info
              entity_id: humidifier.nwt_dehumidifier
            secondary_text: >-
              WDH {{ state_attr('humidifier.nwt_dehumidifier',
              'current_humidity') }}% - {{
              states('sensor.plug_shelly_dehumidifier_bathroom_power') }} W
            hold_action:
              action: navigate
              navigation_path: /dashboard-various/Dehum
            use_ha_icon: true
            icon_color: cyan
          - entity: humidifier.dehumidifier_pasapair
            operator: "="
            state: "on"
            message: >-
              Vysoušeč Obývák – {{
              states('sensor.living_room_shelly_h_t_gen_3_living_room_humidity')
              }}%
            priority: 1
            theme: update
            icon: mdi:fan
            show_badge: false
            tap_action:
              action: more-info
              entity_id: humidifier.dehumidifier_pasapair
            secondary_text: >-
              WDH {{ state_attr('humidifier.dehumidifier_pasapair',
              'current_humidity') }}% - {{
              states('sensor.power_strip_pc_power_4') }} W
            hold_action:
              action: navigate
              navigation_path: /dashboard-various/Dehum
            use_ha_icon: true
            icon_color: cyan
          - entity: humidifier.wdh_214us
            operator: "="
            state: "on"
            message: >-
              Vysoušeč Ložnice – {{
              states('sensor.bedroom_shelly_h_t_gen_3_bedroom_humidity') }}%
            priority: 1
            theme: update
            icon: mdi:fan
            show_badge: false
            tap_action:
              action: more-info
              entity_id: humidifier.wdh_214us
            secondary_text: >-
              WDH {{ state_attr('humidifier.wdh_214us', 'current_humidity') }}%
              - {{ states('sensor.plug_shelly_dehumidifier_bedroom_power') }} W
            hold_action:
              action: navigate
              navigation_path: /dashboard-various/Dehum
            use_ha_icon: true
            icon_color: cyan
          - entity: sensor.bosch_washerdryer_operation_state
            operator: "="
            state: run
            message: >-
              Pračka běží – Zbývá {% set h =
              states('sensor.bosch_washerdryer_estimated_total_program_time') |
              float(0) %} {% set m = (h * 60) | round(0) | int %} {% if m > 60
              %}{{ (m // 60) }}h {{ m % 60 }}min{% else %}{{ m }} min{% endif %}
            priority: 3
            theme: info
            icon: 🫧
            show_badge: false
            tap_action:
              action: navigate
              navigation_path: /dashboard-various/washerdryer
          - entity: sensor.bosch_mycka_operation_state
            operator: "="
            state: BSH.Common.EnumType.OperationState.Run
            message: >-
              Myčka běží – {% set end =
              states('sensor.bosch_mycka_remaining_program_time') %} {% if end
              and end != 'unknown' %} {% set m = [((
              as_datetime(end).timestamp() - now().timestamp()) / 60) | round(0)
              | int, 0] | max %} {% if m > 60 %}{{ (m // 60) }}h {{ m % 60
              }}min{% else %}{{ m }} min{% endif %}{% else %}--{% endif %}
            priority: 3
            theme: info
            icon: 🍽️
            show_badge: false
            tap_action:
              action: navigate
              navigation_path: /dashboard-various/dishwasher
          - entity: sensor.bosch_oven_operation_state
            operator: "="
            state: BSH.Common.EnumType.OperationState.Run
            message: >-
              Trouba běží – {% set end =
              states('sensor.bosch_oven_remaining_program_time') %} {% if end
              and end != 'unknown' %} {% set m = [((
              as_datetime(end).timestamp() - now().timestamp()) / 60) | round(0)
              | int, 0] | max %} {% if m > 60 %}{{ (m // 60) }}h {{ m % 60
              }}min{% else %}{{ m }} min{% endif %}{% else %}--{% endif %}
            priority: 2
            theme: warning
            icon: 🔥
            show_badge: false
            tap_action:
              action: navigate
              navigation_path: /dashboard-various/Oven
          - entity: binary_sensor.ariston_is_heating
            operator: "="
            state: "on"
            message: >-
              Bojler nahřívá – {{ state_attr('water_heater.bojler',
              'current_temperature') }}°C → {{ state_attr('water_heater.bojler',
              'temperature') }}°C
            secondary_text: >-
              {% set ready = states('sensor.bojler_ready_time') %} {% if ready
              not in ('unavailable', 'unknown', '') %} Hotovo v {{ (ready |
              as_datetime | as_local).strftime('%H:%M') }} {% endif %}
            priority: 1
            theme: warning
            icon: 🌡️
            show_badge: false
            tap_action:
              action: more-info
              entity_id: water_heater.bojler
          - entity: switch.hdo
            operator: "="
            state: "on"
            message: >-
              Nízký tarif (NT) – změna v {{ (states('sensor.hdo_next_change_dt')
              | as_datetime | as_local).strftime('%H:%M') }}
            priority: 4
            theme: success
            icon: 🌿
            show_badge: false
            tap_action:
              action: navigate
              navigation_path: /dashboard-various/HDO
          - entity: switch.hdo
            operator: "="
            state: "off"
            message: >-
              Vysoký tarif (VT) – změna v {{
              (states('sensor.hdo_next_change_dt') | as_datetime |
              as_local).strftime('%H:%M') }}
            priority: 1
            theme: emergency
            icon: ⚡
            show_badge: false
            tap_action:
              action: navigate
              navigation_path: /dashboard-various/HDO
          - entity: sensor.odpad_nejblizsi_dnu
            operator: "="
            state: "0"
            message: Dnes svoz odpadu!
            secondary_text: "{{ states('sensor.papir').split(' - ')[0] }}"
            priority: 1
            theme: caution
            icon: 🗑️
            show_badge: false
            tap_action:
              action: more-info
              entity_id: sensor.papir
          - entity: sensor.odpad_nejblizsi_dnu
            operator: "="
            state: "1"
            message: Zítra svoz odpadu
            secondary_text: "{{ states('sensor.papir').split(' - ')[0] }}"
            priority: 3
            theme: info
            icon: 🗑️
            show_badge: false
            tap_action:
              action: more-info
              entity_id: sensor.papir
rooms:
  - id: bedroom
    name: Bedroom
    area_match:
      - Bedroom
    base_image: /local/Dashboards/Rooms/Bedroom-svetlo-off.webp
    cards_below:
      - card:
          type: custom:bubble-card
          card_type: button
          entity: cover.roller_motor_bedroom
          show_name: false
          show_state: false
          show_icon: true
          button_type: slider
          sub_button:
            main:
              - icon: mdi:roller-shade-closed
                color: indigo
                show_background: false
                tap_action:
                  action: perform-action
                  perform_action: cover.set_cover_position
                  target:
                    entity_id: cover.roller_motor_bedroom
                  data:
                    position: 0
              - icon: mdi:roller-shade
                color: blue-grey
                show_background: false
                tap_action:
                  action: perform-action
                  perform_action: cover.set_cover_position
                  target:
                    entity_id: cover.roller_motor_bedroom
                  data:
                    position: 2
              - icon: mdi:blinds
                color: orange
                show_background: false
                tap_action:
                  action: perform-action
                  perform_action: cover.set_cover_position
                  target:
                    entity_id: cover.roller_motor_bedroom
                  data:
                    position: 65
              - icon: mdi:blinds-open
                color: amber
                show_background: false
                tap_action:
                  action: perform-action
                  perform_action: cover.set_cover_position
                  target:
                    entity_id: cover.roller_motor_bedroom
                  data:
                    position: 100
            bottom: []
          styles: |-
            ha-card {
              --bubble-button-main-background-color: rgba(0, 0, 0, 0.6) !important;
            }
            .bubble-range-fill {
              background: rgba(130, 115, 105, 0.4) !important;
              opacity: 1 !important;
            }
            .bubble-sub-button:nth-child(2) ha-icon {
              color: var(--indigo-color) !important;
            }
            .bubble-sub-button:nth-child(3) ha-icon {
              color: var(--blue-grey-color) !important;
            }
            .bubble-sub-button:nth-child(4) ha-icon {
              color: var(--orange-color) !important;
            }
            .bubble-sub-button:nth-child(5) ha-icon {
              color: var(--amber-color) !important;
            }
          force_icon: false
          show_last_changed: false
          show_attribute: false
          card_layout: normal
    filter_conditions:
      - condition:
          entity: light.light_group_bedroom
          state: "on"
        filter: brightness(2.6) sepia(0.35) saturate(0.9)
      - condition:
          entity: sun.sun
          state: above_horizon
        filter: brightness(1.7) sepia(0.12) saturate(1.05)
      - filter: brightness(0.6) sepia(0.3)
    overlays:
      - id: overlay_svetlo
        transition: 2.0s ease
        image: /local/Dashboards/Rooms/Bedroom-overlay-SVETlo.webp
        conditions:
          opacity:
            - condition:
                entity: light.light_group_bedroom
                state: "on"
              value: 1
            - value: 0
      - id: overlay_tv
        transition: 2.0s ease
        conditions:
          opacity:
            - condition:
                entity: media_player.lg_webos_tv_oled83g58lw_beuyljp
                state_not:
                  - "off"
                  - unavailable
              value: 1
            - value: 0
        state_images:
          - entity: sensor.lg_webos_tv_oled83g58lw_beuyljp_tv_source_bedroom
            state: Stremio
            image: /local/Dashboards/Rooms/tv-Stremio-Test2.webp
          - entity: sensor.lg_webos_tv_oled83g58lw_beuyljp_tv_source_bedroom
            state: Nuvio TV
            image: /local/Dashboards/Rooms/tv-Stremio-Test2.webp
          - entity: sensor.lg_webos_tv_oled83g58lw_beuyljp_tv_source_bedroom
            state: YouTube AdFree
            image: /local/Dashboards/Rooms/tv-YouTube-Test2.webp
          - image: /local/Dashboards/Rooms/tv-LG-Test2.webp
      - id: overlay_dehumidifier
        transition: 2.0s ease
        image: /local/Dashboards/Rooms/overlay-Bedroom-dehumidifier.webp
        animation: pulse
        conditions:
          opacity:
            - condition:
                entity: humidifier.wdh_214us
                state: "on"
                or:
                  entity: binary_sensor.wdh_214us_tank_full
                  state: "on"
              value: 1
            - value: 0
          filter:
            - condition:
                entity: binary_sensor.wdh_214us_tank_full
                state: "on"
              value: hue-rotate(120deg) saturate(3) brightness(1.3)
            - value: none
    zones:
      - id: zone_okno
        top: 1.5%
        left: 41%
        width: 17.1%
        height: 33.5%
        tap_action:
          action: navigate
          path: /dashboard-various/weather
        hold_action:
          action: toggle
          entity: input_boolean.zobrazeni_pocasi
      - id: zone_tv
        top: 30%
        left: 70%
        width: 20%
        height: 50%
